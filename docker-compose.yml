services:
  dash:
    build: .
    container_name: ai-memory-dash
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
    # ponytail: bind so no loopback - a dash carrega o token e nao tem auth propria
    ports:
      - "127.0.0.1:3838:3838"
    volumes:
      # dist/ e public/static/app.js sao gerados por `npm run build` no host;
      # montar os dois deixa recarregar sem rebuild da imagem.
      - ./dist:/app/dist:ro
      - ./public:/app/public:ro
      # Backups ficam no host: o upstream nao guarda nenhum, e perder o
      # historico junto com o container derrotaria o proposito.
      - ./backups:/app/backups

